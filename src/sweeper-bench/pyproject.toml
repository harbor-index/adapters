[project]
name = "harbor-sweeper-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for SWEeper-Bench (interactive web-app bug discovery)"
readme = "README.md"
authors = [
    { name = "Chengzhi Liu", email = "chengzhi@ucsb.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.24",
    "pyyaml>=6.0",
]

[project.scripts]
sweeper-bench = "sweeper_bench.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sweeper_bench"
