# Reference config for FrontierFinance.
# The verifier needs ANTHROPIC_API_KEY, OPENAI_API_KEY and GEMINI_API_KEY
# (placeholders are fine for the oracle agent, which never calls the judges;
# use placeholders of several characters, since Harbor redacts key values from
# collected artifacts).
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 8
quiet: false
environment:
  type: docker
  # Cloud alternative (needs DAYTONA_API_KEY):
  # type: daytona
  force_build: false
  delete: true
agents:
  # Default: oracle agent for verification
  - name: oracle
  # Uncomment to run with other agents:
  # - name: claude-code
  #   model_name: anthropic/claude-sonnet-4-6
  # - name: codex
  #   model_name: openai/gpt-5.4
datasets:
  - path: datasets/frontier-finance
