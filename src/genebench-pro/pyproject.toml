[project]
name = "harbor-genebench-pro-adapter"
version = "0.1.0"
description = "Harbor adapter for the ten public GeneBench-Pro case studies"
readme = "README.md"
authors = [
    { name = "Yang Zhou", email = "nbzy1995@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["huggingface-hub>=0.34,<2"]

[project.scripts]
genebench-pro = "genebench_pro.main:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "genebench_pro"
