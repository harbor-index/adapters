[project]
name = "harbor-agenteval-games-adapter"
version = "0.1.0"
description = "AgentGym AgentEval Maze and Wordle test splits for Harbor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["termcolor==2.4.0"]

[project.scripts]
agenteval-games = "agenteval_games.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval_games"]
