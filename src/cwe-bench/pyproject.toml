[project]
name = "harbor-cwe-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for CWE-bench: defensive audit-and-patch security tasks"
readme = "README.md"
authors = [
    { name = "Himanshu Gupta", email = "him141195@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.0",
    "tomlkit>=0.13",
]

[project.scripts]
cwe-bench = "cwe_bench.main:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cwe_bench"
