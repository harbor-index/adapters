[project]
name = "harbor-embodiedlab-adapter"
version = "0.1.0"
description = "Harbor adapter for EmbodiedLab, a benchmark of robot agents that run their own experiments in a simulated laboratory"
readme = "README.md"
authors = [
    { name = "Zelin Zheng", email = "zhengzelin200303@163.com" },
    { name = "Hongcheng Gao", email = "gaohongcheng2000@gmail.com" },
]
requires-python = ">=3.12"
# The generator imports the EmbodiedLab source tree (instance derivation, task registry, evaluator prewarm, the
# trial runner's texts); these are the versions its requirements.txt pins.
dependencies = [
    "cloudpickle==3.1.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "numpy==1.26.4",
    "packaging==26.3",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "scipy==1.15.3",
    "uvicorn==0.53.0",
    "websockets==16.1.1",
]

[project.scripts]
embodiedlab = "embodiedlab.main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "embodiedlab"
