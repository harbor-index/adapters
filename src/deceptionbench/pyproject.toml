[project]
name = "harbor-deceptionbench-adapter"
version = "0.1.0"
description = "Pinned DeceptionBench single-turn L1/L2 tasks for Harbor"
readme = "README.md"
authors = [{ name = "YuCheng (Tom) Yuan", email = "tomyuanyucheng@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["openai==2.54.0", "tqdm>=4.67,<5"]

[project.optional-dependencies]
native = ["harbor==0.22.0"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
deceptionbench = "deceptionbench.main:main"
deceptionbench-original = "deceptionbench.original:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deceptionbench"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
