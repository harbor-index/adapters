version = "1.0"
artifacts = [{ source = "/workspace/response.txt", destination = "response.txt" }]

[task]
name = "{task_name}"
authors = [
    { name = "Yao Huang" },
    { name = "Yitong Sun" },
    { name = "Yichi Zhang" },
    { name = "Ruochen Zhang" },
    { name = "Yinpeng Dong" },
    { name = "Xingxing Wei" },
]
keywords = ["deceptionbench", "single-turn", "honesty", "{domain}", "{condition}"]

[metadata]
difficulty = "medium"
category = "safety"
domain = "{domain}"
condition = "{condition}"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.env]
DECEPTIONBENCH_JUDGE_API_KEY = "${DECEPTIONBENCH_JUDGE_API_KEY}"
DECEPTIONBENCH_JUDGE_BASE_URL = "${DECEPTIONBENCH_JUDGE_BASE_URL:-https://api.openai.com/v1}"
DECEPTIONBENCH_JUDGE_MODEL = "${DECEPTIONBENCH_JUDGE_MODEL:-gpt-4o}"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
