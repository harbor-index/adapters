# Default job config: oracle over the full dataset (expect 100%).
jobs_dir: jobs
n_attempts: 1
orchestrator:
  type: local
  n_concurrent_trials: 8
environment:
  type: docker
  delete: true
agents:
  - name: oracle
# Other agents, e.g.:
# agents:
#   - name: claude-code
#     model_name: anthropic/claude-sonnet-4-5-20250929
datasets:
  - path: datasets/taxcalcbench
