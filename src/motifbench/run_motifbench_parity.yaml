jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false

environment:
  type: docker
  delete: true

datasets:
  - path: datasets/motifbench

agents:
  - name: mini-swe-agent
    model_name: openai/gpt-5.4-mini
    model_api_key_name: OPENAI_API_KEY
    model_api_format: openai_chat_completions
    override_timeout_sec: 1200
    override_setup_timeout_sec: 3600
    kwargs:
      version: "2.2.8"
      cost_limit: "1.0"
      session_id_headers: []
      config_file: src/motifbench/configs/mini_swe_agent.yaml
