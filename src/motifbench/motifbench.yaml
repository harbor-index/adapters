jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 2
  quiet: false

environment:
  type: docker
  force_build: true
  delete: true

# Default: oracle agent for verification
agents:
  - name: oracle

# Uncomment to run with other agents:
# agents:
#   - name: codex
#     model_name: openai/gpt-5-mini
#
# agents:
#   - name: claude-code
#     model_name: anthropic/claude-sonnet-4-5

datasets:
  - path: datasets/motifbench
