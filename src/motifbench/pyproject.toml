[project]
name = "harbor-motifbench-adapter"
version = "0.1.0"
description = "Harbor adapter for MotifBench (Critic's Eye): long-document non-lexical literary motif recovery"
readme = "README.md"
authors = [
    { name = "Xinyu Sun", email = "sunxy23@m.fudan.edu.cn" },
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
motifbench = "motifbench.main:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "motifbench"
