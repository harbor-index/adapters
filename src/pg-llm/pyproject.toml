[project]
name = "harbor-pg-llm-adapter"
version = "0.1.0"
description = "Harbor adapter for PG-LLM (ProteinGym-LLM protein variant fitness ranking benchmark)"
readme = "README.md"
license-files = ["THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pg-llm = "pg_llm.main:main"
pg-llm-score = "pg_llm.score:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_llm"]
