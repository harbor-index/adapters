# Resolved relative to the adapters repository root.
datasets:
  - path: datasets/pg-llm

# Default: oracle agent for verification.
# To evaluate a model agent, replace `- name: oracle` with one of the commented
# entries below under this same `agents:` key (coordinate parity plan on Discord first).
# For cleanroom runs generated with `--network-mode no-network` (on Daytona or
# Linux Docker with CONFIG_NFT_FIB_INET), either use a prepared agent image or
# pass `--allow-environment-host <setup-registry-host>` (setup installs only)
# alongside `--allow-agent-host <provider-host>` (rollout inference only):
agents:
  - name: oracle
#   - name: codex
#     model_name: openai/gpt-5-mini
#   - name: claude-code
#     model_name: claude-haiku-4-5-20251001

environment:
  type: docker
  delete: true

n_concurrent_trials: 4
