[project]
name = "harbor-exp-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for EXP-Bench: AI research experiment tasks from ICLR/NeurIPS 2024 papers"
readme = "README.md"
authors = [
    { name = "Jingjia Peng", email = "jingjia@umich.edu" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
exp-bench = "exp_bench.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "exp_bench"
