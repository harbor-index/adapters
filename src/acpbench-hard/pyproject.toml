[project]
name = "harbor-acpbench-hard-adapter"
version = "0.1.0"
description = "Harbor adapter for the ACPBench-Hard benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jinja2==3.1.6", "PyYAML==6.0.2"]

[project.scripts]
acpbench-hard = "acpbench_hard.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acpbench_hard"]
