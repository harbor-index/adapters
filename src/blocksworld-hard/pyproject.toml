[project]
name = "harbor-blocksworld-hard-adapter"
version = "0.1.0"
description = "Harbor adapter for the 110-instance Blocksworld Hard benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
blocksworld-hard = "blocksworld_hard.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blocksworld_hard"]
