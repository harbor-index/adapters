[project]
name = "harbor-mbabench-2-0-adapter"
version = "0.1.0"
description = "Harbor adapter for MBABench 2.0 (financial-modelling tasks built in Excel)"
readme = "README.md"
authors = [
    { name = "ayush1298", email = "munotayush6@kgpian.iitkgp.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=0.30",
]

[project.scripts]
mbabench-2-0 = "mbabench_2_0.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mbabench_2_0"
