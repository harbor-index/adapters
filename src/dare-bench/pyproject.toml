[project]
name = "harbor-dare-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for DARE-Bench (Snowflake-Labs/dare-bench) public evaluation release"
readme = "README.md"
authors = [
    { name = "macbadul9", email = "abdulwaheed1513@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dare-bench = "dare_bench.main:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dare_bench"

[dependency-groups]
dev = ["pytest>=8"]
