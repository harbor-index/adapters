[project]
name = "harbor-cmphysbench-adapter"
version = "0.1.0"
description = "Harbor adapter for CMPhysBench (condensed-matter physics problems scored by SEED)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cmphysbench = "cmphysbench.main:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cmphysbench"
