# Reference config for the DistDebug-Bench adapter (34-task Lite split).
# Generate tasks first:  cd src/distdebug-bench && uv run distdebug-bench --output-dir ../../datasets/distdebug-bench
# Then, from the adapters repo root:  harbor run -c src/distdebug-bench/run_distdebug-bench.yaml
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  # type: daytona
  delete: true
datasets:
  - path: datasets/distdebug-bench

# Default: oracle agent (expected reward 1.0 = block_coverage on every task).
agents:
  - name: oracle

