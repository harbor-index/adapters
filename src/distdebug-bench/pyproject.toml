[project]
name = "harbor-distdebug-bench-adapter"
version = "0.1.0"
description = "Harbor adapter for DistDebug-Bench (root-cause localization of distributed-system bugs)"
readme = "README.md"
authors = [
    { name = "Xiang Ding" },
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
distdebug-bench = "distdebug_bench.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distdebug_bench"]
