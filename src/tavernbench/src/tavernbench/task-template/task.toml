schema_version = "1.0"

[task]
# The adapter fills in the placeholders for each task.
name = "{task_name}"
description = "TavernBench {scenario} ({category}): a Hearthstone Battlegrounds decision or rule-execution question answered with one JSON object."
# Authors of the original benchmark (Ma and Wang, arXiv:2610.33845).
authors = [
    { name = "Changlian Ma" },
    { name = "Limin Wang" },
]
keywords = ["tavernbench", "hearthstone-battlegrounds", "game", "reasoning", "{category}"]

[metadata]
difficulty = "hard"
category = "reasoning"
source = "MCG-NJU/AutoTavern"
source_commit = "{source_commit}"
source_id = "{source_id}"
scenario = "{scenario}"
tavernbench_category = "{category}"
scoring = "{scoring}"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
