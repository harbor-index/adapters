version = "1.0"
artifacts = ["/workspace/model.py"]

[task]
name = "dcp-bench-open/{task_id}"
authors = [{name = "Kostis Michailidis"}, {name = "Dimos Tsouros"}, {name = "Tias Guns"}]

[metadata]
category = "constraint-programming"
tags = ["cpmpy", "optimization", "dcp-bench-open"]

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096

[verifier]
environment_mode = "separate"
timeout_sec = 1500.0  # scaled by the generator for the selected instances

[verifier.environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 6144
storage_mb = 12288
