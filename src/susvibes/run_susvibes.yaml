# Reference config for the SusVibes adapter.
#
#   harbor run -c src/susvibes/run_susvibes.yaml
#
# The oracle agent is the default: it applies each task's golden patch and
# should reach reward 1.0 on every task. Each trial pulls one pre-built
# task image (about 1 GB compressed on average, 6 GB at most) and removes it
# afterwards, so disk use is bounded by the number of concurrent trials.
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  force_build: true
  delete: true
  # env:
  #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

# Default: oracle agent for verification
agents:
  - name: oracle

# Uncomment to run with other agents:
# agents:
#   - name: claude-code
#     model_name: anthropic/claude-sonnet-4-5-20250929
#
# agents:
#   - name: codex
#     model_name: openai/gpt-5-mini

datasets:
  - path: datasets/susvibes
