[project]
name = "harbor-susvibes-adapter"
version = "0.1.0"
description = "Harbor adapter for SusVibes: repository-level feature tasks graded on functional correctness and security"
readme = "README.md"
authors = [
    { name = "zhaihaotian", email = "zihan9198@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
susvibes = "susvibes.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "susvibes"
