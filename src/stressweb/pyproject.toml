[project]
name = "harbor-stressweb-adapter"
version = "0.1.0"
description = "Generate pinned StressWeb Note tasks for Harbor"
readme = "README.md"
authors = [
    { name = "Haoyue Bai", email = "baihaoyue621@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stressweb = "stressweb.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stressweb"
