[project]
name = "harbor-shade-arena-adapter"
version = "0.1.0"
description = "Convert the public SHADE-Arena benchmark to Harbor tasks"
readme = "README.md"
authors = [
    { name = "ykchen824", email = "ykchen824@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.42.0",
    "docstring-parser==0.16",
    "email-validator==2.2.0",
    "google-generativeai==0.8.5",
    "jsonref==1.1.0",
    "matplotlib==3.10.0",
    "openai==1.58.1",
    "openapi-pydantic==0.5.1",
    "pandas==2.2.3",
    "psutil==6.1.1",
    "pydantic==2.10.4",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "seaborn==0.13.2",
    "tenacity==8.5.0",
    "tiktoken==0.8.0",
]

[project.scripts]
shade-arena = "shade_arena.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shade_arena"
