[project]
name = "harbor-physcibench-adapter"
version = "0.1.0"
description = "Harbor adapter for the PhySciBench physical-science benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
physcibench = "physcibench.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "physcibench"
