schema_version = "1.0"

[task]
name = "facebookresearch/airs-bench__{{task_id}}"
description = "AIRS-Bench task {{task_name}}: {{metric}} on {{dataset}}"
authors = [
    { name = "Alisia Lupidi" },
    { name = "Bhavul Gauri" },
    { name = "Despoina Magka" },
    { name = "Roberta Raileanu" },
    { name = "Alexander Miller" },
    { name = "Tatiana Shavrina" },
    { name = "Jakob Foerster" },
    { name = "Yoram Bachrach" },
]
keywords = ["machine-learning", "research-agents", "airs-bench", "{{category}}"]

[metadata]
difficulty = "hard"
category = "machine-learning"

[verifier]
network_mode = "public"
timeout_sec = 1800.0

[agent]
network_mode = "public"
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
