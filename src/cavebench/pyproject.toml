[project]
name = "harbor-cavebench-adapter"
version = "0.1.0"
description = "Harbor adapter for CaveBench (abductive physical reasoning from interior frames)"
readme = "README.md"
authors = [
    { name = "Yichen Wang", email = "ycwang6371@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cavebench = "cavebench.main:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cavebench"
