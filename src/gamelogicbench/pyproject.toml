[project]
name = "harbor-gamelogicbench-adapter"
version = "0.1.0"
description = "Generate Harbor tasks from pinned GameLogicBench sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.3"]

[project.scripts]
gamelogicbench = "gamelogicbench.main:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamelogicbench"]
