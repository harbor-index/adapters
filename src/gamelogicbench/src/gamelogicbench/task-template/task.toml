version = "1.0"
artifacts = ["/workspace/game"]

[task]
name = "$task_name"
authors = [
  {name = "Xinyu Che"}, {name = "Yunfei Ge"}, {name = "Shihao Li"},
  {name = "Yanchen Liu"}, {name = "Hang Yan"}, {name = "Xinping Lei"},
  {name = "Yanghai Wang"}, {name = "Zixuan Dong"}, {name = "Yifan Yao"},
  {name = "Qianqian Xie"}, {name = "Letian Zhu"}, {name = "Jiaheng Liu"},
]
keywords = ["godot", "game-logic", "gdscript"]

[metadata]
category = "programming"
upstream_task_id = "$task_id"
upstream_kind = "$kind"
upstream_harness_revision = "$harness_revision"
upstream_tasks_revision = "$tasks_revision"
$license_notice

[environment]
os = "linux"
network_mode = "$agent_network_mode"
allowed_hosts = $allowed_hosts
cpus = $solve_cpus
memory_mb = $solve_memory_mb

[agent]
timeout_sec = $solve_timeout
network_mode = "$agent_network_mode"
allowed_hosts = $allowed_hosts

[verifier]
environment_mode = "separate"
user = "root"
timeout_sec = $verifier_timeout

[verifier.environment]
os = "linux"
network_mode = "no-network"
cpus = $verifier_cpus
memory_mb = $verifier_memory_mb
