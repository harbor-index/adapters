[project]
name = "harbor-gamedevbench-adapter"
version = "0.1.0"
description = "Harbor adapter for the official waynchi/GameDevBench Godot benchmark"
readme = "README.md"
authors = [
    { email = "tianshixu@stu.pku.edu.cn" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gamedevbench = "gamedevbench.main:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gamedevbench"
