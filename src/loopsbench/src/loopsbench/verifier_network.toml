# Verifier egress for the 104 reviewed tasks in bundle c47e13a.
# Evidence on oahu: datasets/isolated_oracle_20261122T072255Z task IDs,
# corresponding source run-tests.sh / Dockerfiles, and
# jobs/isolated_oracle_legacy_20261122T081219Z/*/verifier/post-test.txt.
# Exact hosts include required package/artifact redirects. Historical test
# logs were collected under the previous policy and are not allowlist tests.

[hosts]
uv = ["astral.sh", "releases.astral.sh", "github.com", "release-assets.githubusercontent.com"]
pypi = ["pypi.org", "files.pythonhosted.org"]
ubuntu = ["archive.ubuntu.com", "security.ubuntu.com"]
debian = ["deb.debian.org"]
aliyun = ["mirrors.aliyun.com"]
nodesource = ["deb.nodesource.com"]
maven_central = ["repo.maven.apache.org", "repo1.maven.org"]
jboss = ["repository.jboss.org"]
princeton = ["algs4.cs.princeton.edu"]
cargo = ["index.crates.io", "static.crates.io"]
go = ["proxy.golang.org", "sum.golang.org", "storage.googleapis.com"]
npm = ["registry.npmjs.org"]
nuget = ["api.nuget.org", "globalcdn.nuget.org"]

# Stage pinned pytest in the interpreter the original script uses. These
# installs are already satisfied when the offline verifier runs the script.
[build.task_riscv_cpu_six_labs]
anchor = "COPY requirements/ /workspace/requirements/"
replacement = """
COPY requirements/ /workspace/requirements/
RUN python3 -m venv /tmp/loopsbench-venv \\
    && /tmp/loopsbench-venv/bin/pip install --no-cache-dir pytest==8.4.1
"""

[build.task_sicp_py_scheme_sql]
anchor = "RUN pip install --no-cache-dir pytest"
replacement = "RUN pip install --no-cache-dir pytest==8.4.1"

