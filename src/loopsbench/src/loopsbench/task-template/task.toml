version = "1.0"
source = "LoopsBench"

artifacts = [
  { source = "/logs/artifacts", exclude = ["*"] },
  "/tmp/loopsbench-workspace.tar.gz",
]

[task]
name = "loopsbench/{harbor_id}"
description = "LoopsBench long-horizon terminal task {upstream_id}"
authors = [
  { name = "Han Li" },
  { name = "Zhemin Fang" },
  { name = "Rili Feng" },
  { name = "Yingqi Zhao" },
  { name = "Jiaheng Liu" },
  { name = "Pengfei Gao" },
  { name = "He Ye" },
  { name = "Dayi Lin" },
  { name = "Qingwei Lin" },
  { name = "Saravan Rajmohan" },
  { name = "Dongmei Zhang" },
]
keywords = {keywords}

[metadata]
source = "LoopsBench"
upstream_task_id = "{upstream_id}"
upstream_bundle = "{bundle}"
difficulty = "{difficulty}"
category = "{category}"
tags = {tags}

[agent]
timeout_sec = {agent_timeout_sec}
network_mode = "allowlist"
allowed_hosts = []

[verifier]
timeout_sec = {verifier_timeout_sec}
environment_mode = "separate"
{verifier_network}

[[verifier.collect]]
timeout_sec = 600
command = '''
set -eu
archive=/tmp/loopsbench-workspace.tar.gz
rm -f -- "$archive"
temporary=$(mktemp /tmp/loopsbench-collect.XXXXXXXX)
trap 'rm -f -- "$temporary"' EXIT
# GNU tar returns 1 when files change while it reads them, for example while
# a background Git repack finishes. Publish only a successful snapshot.
for delay in 1 4 16 0; do
    status=0
    tar --format=pax -czf "$temporary" -C /workspace . || status=$?
    if [ "$status" -eq 0 ]; then
        mv -fT -- "$temporary" "$archive"
        exit 0
    fi
    if [ "$status" -ne 1 ] || [ "$delay" -eq 0 ]; then
        exit "$status"
    fi
    sleep "$delay"
done
'''

[environment]
network_mode = "public"
build_timeout_sec = {build_timeout_sec}
cpus = {cpus}
memory_mb = {memory_mb}
storage_mb = {storage_mb}
gpus = 0
