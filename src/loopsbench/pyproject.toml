[project]
name = "harbor-loopsbench-adapter"
version = "0.1.0"
description = "Harbor adapter for LoopsBench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
loopsbench = "loopsbench.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loopsbench"
