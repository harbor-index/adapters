[project]
name = "harbor-cot-control-adapter"
version = "0.1.0"
description = "Harbor adapter for CoT-Control, an evaluation suite for chain-of-thought controllability"
readme = "README.md"
authors = [
    { name = "Run-Ze Fan", email = "runze.fan@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "tqdm>=4.66",
]

[project.scripts]
cot-control = "cot_control.main:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cot_control"
