[project]
name = "harbor-artifactsbench-adapter"
version = "0.1.0"
description = "Generate Harbor tasks from Tencent ArtifactsBench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
artifactsbench = "artifactsbench.main:main"

[build-system]
requires = ["uv_build>=0.9.29,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "artifactsbench"
