schema_version = "1.0"

[task]
name = "robust-kbench/robust-kbench__{{task_id}}"
authors = [
    { name = "Sakana AI" }
]
keywords = ["cuda", "gpu", "kernel", "optimization", "pytorch", "robust-kbench"]

[metadata]
difficulty = "hard"
category = "coding"
source = "robust-kbench"
task_name = "{{task_name}}"
pass_type = "{{pass_type}}"

[verifier]
network_mode = "public"
timeout_sec = 600.0

[agent]
network_mode = "public"
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 1
