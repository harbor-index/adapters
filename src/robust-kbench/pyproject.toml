[project]
name = "harbor-robust-kbench-adapter"
version = "0.1.0"
description = "Harbor adapter for Sakana AI's robust-kbench (CUDA kernel robustness and optimization benchmark)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "ninja",
    "pydantic",
    "tqdm",
]

[project.scripts]
robust-kbench = "robust_kbench.main:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robust_kbench"]
