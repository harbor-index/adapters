[project]
name = "harbor-agencybench-adapter"
version = "0.1.0"
description = "Harbor adapter for AgencyBench V2 long-horizon multi-stage autonomous agent scenarios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agencybench = "agencybench.main:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agencybench"
