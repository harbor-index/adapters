[project]
name = "harbor-authorizationbench-adapter"
version = "0.1.0"
description = "Harbor adapter for AuthorizationBench (LLM agent authorization alignment)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
authorizationbench = "authorizationbench.main:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "authorizationbench"
