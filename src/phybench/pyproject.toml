[project]
name = "harbor-phybench-adapter"
version = "0.1.0"
description = "Harbor adapter for PHYBench (text-only physics problems scored by expression edit distance)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
phybench = "phybench.main:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "phybench"
