[project]
name = "harbor-vision2web-adapter"
version = "0.1.0"
description = "Generate Harbor tasks for Vision2Web visual website development"
readme = "README.md"
authors = [
    { name = "Shuting Zhao", email = "68221091+stzoozz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[project.scripts]
vision2web = "vision2web.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vision2web"

[tool.ruff]
line-length = 100
