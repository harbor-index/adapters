[project]
name = "harbor-active-swe-adapter"
version = "0.1.0"
description = "Harbor adapter for Active-SWE (Recorded track)"
readme = "README.md"
authors = [
    { name = "HarperLi680" }
]
requires-python = ">=3.12"
dependencies = ["pyarrow>=15"]

[project.scripts]
active-swe = "active_swe.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "active_swe"
