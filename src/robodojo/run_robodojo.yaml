# Run from the adapters repository root after generating datasets/robodojo.
# Install this adapter in the same Python environment as Harbor.
jobs_dir: jobs
n_attempts: 1
datasets:
  - path: datasets/robodojo

# No validated oracle exists, so this configuration uses the Direct agent: a
# vision model that controls the robot through one bounded-action tool.
# Replace the model with a vision model that supports tool calls, and export
# its API key in the shell that runs Harbor.
agents:
  - import_path: robodojo.direct_agent:DirectAgent
    model_name: provider/vision-model
    kwargs:
      image_history: 1
      history_window: 0
      max_invalid_responses: 5
      # Set the endpoint explicitly for parity runs; it is recorded without
      # credentials and must match across the trials of one aggregate.
      # api_base: https://api.provider.example/v1
      # Safety limits. Reaching one aborts the run and yields no reward.
      # max_cost_usd: 50.0
      # max_decisions_per_episode: 400

# The simulator runs in a sidecar service, and the verifier reads its files,
# so a Compose-capable environment with an NVIDIA GPU is required.
environment:
  type: docker
  delete: true

# Each trial uses the GPU for the whole evaluation.
orchestrator:
  type: local
  n_concurrent_trials: 1
