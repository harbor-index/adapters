[project]
name = "harbor-sol-execbench-adapter"
version = "0.1.0"
description = "Generate Harbor tasks for NVIDIA SOL-ExecBench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sol-execbench = "sol_execbench.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sol_execbench"]
