version = "1.0"

# One public software arena. Repeated rounds and tournament runs are not tasks.
artifacts = [{source = "/codeclash/evidence", destination = "codeclash-evidence"}]

[task]
name = "codeclash/arena"
authors = [{name = "John Yang"}, {name = "Kilian Lieret"}, {name = "Joyce Yang"}, {name = "Carlos E. Jimenez"}, {name = "Ofir Press"}, {name = "Ludwig Schmidt"}, {name = "Diyi Yang"}]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["coding", "multi-agent", "competitive", "codeclash", "arena"]

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
