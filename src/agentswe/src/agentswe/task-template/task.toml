version = "1.0"
artifacts = [
  { source = "/workspace/submission" },
  { source = "/var/agentswe-env/environment.tar" },
  { source = "/var/agentswe/run", service = "evaluator" },
]

[task]
name = "agentswe/{{TASK_ID}}"
description = "AgentSWE Creation task `{{SHORT}}` ({{TITLE}}): build a task-specific agent from a natural-language requirement in one Builder session with authoritative dev feedback; the frozen agent is scored on held-out cases."
authors = [{{AUTHORS}}]
keywords = ["agentswe", "{{FAMILY}}", "agent-building", "long-horizon", "llm-as-a-judge", "{{SHORT}}"]

[metadata]
difficulty = "hard"
category = "agent-development"
agentswe_family = "{{FAMILY}}"
agentswe_task = "{{TASK_ID}}"
agentswe_short = "{{SHORT}}"
agentswe_tier = "{{TIER}}"
agentswe_lite = {{LITE}}
agentswe_profile = "{{PROFILE}}"
agentswe_max_dev_rounds = {{MAX_DEV_ROUNDS}}
upstream_repo = "https://github.com/VectorSpaceLab/AgentSWE"
upstream_commit = "{{COMMIT}}"

[agent]
timeout_sec = {{BUILDER_TIMEOUT}}
user = "root"

[verifier]
environment_mode = "separate"
timeout_sec = {{VERIFIER_TIMEOUT}}
user = "root"

[verifier.env]
{{VERIFIER_ENV}}

# The Builder's private environment travels as one tarball: artifact uploads rewrite symlink
# targets, which upstream's environment digest would treat as a change.
[[verifier.collect]]
service = "main"
command = "tar -C / -cf /var/agentswe-env/environment.tar {{ENV_PREFIX_RELATIVE}}"
timeout_sec = 1800.0

# Upstream one_stop.py freezes the delivery after the Builder exits; sidecar hooks run after main stops.
[[verifier.collect]]
service = "evaluator"
command = "python3 -m agentswe_harbor.freeze"
timeout_sec = 7200.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 8192
storage_mb = 16384
allow_internet = true
workdir = "/workspace"
