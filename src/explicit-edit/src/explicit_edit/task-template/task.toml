# Refer to https://harborframework.com/docs/task-format for more details.

schema_version = "1.0"

[task]
name = "explicit-edit/explicit-edit__{{TASK_ID}}"
description = "Explicit Edit Benchmark task {{TASK_ID}}: perform fully specified, byte-exact file edits."
authors = [{ name = "Aleksandr Shpuntenko" }]
keywords = {{KEYWORDS}}

[metadata]
difficulty = "medium"
category = "file-editing"
upstream_id = "{{TASK_ID}}"
upstream_category = "{{CATEGORY}}"
language = "{{LANGUAGE}}"
variant = "{{VARIANT}}"
scale = {{SCALE}}
scale_unit = "{{SCALE_UNIT}}"
fixture_sha256 = "{{FIXTURE_SHA256}}"

[verifier]
timeout_sec = 120.0

[agent]
# Matches the original benchmark's default per-attempt timeout.
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
