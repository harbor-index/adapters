schema_version = "1.4"

artifacts = [
  "/logs/agent/final_response.txt",
  { source = "/runtime_logs/execution.json", service = "runtime" },
]

[task]
name = "agentabstain/example"
authors = [{ name = "AgentAbstain adapter maintainers" }]

[metadata]
difficulty = "medium"
category = "agentic-abstention"
tags = ["agentic-abstention", "mcp"]

[metadata.harbor.lint]
ignore = ["artifact-log-overlap"]

[verifier]
timeout_sec = 10800.0
environment_mode = "separate"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
