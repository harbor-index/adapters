[project]
name = "harbor-agentabstain-adapter"
version = "0.1.0"
description = "Harbor adapter for AgentAbstain"
readme = "README.md"
authors = [
    { name = "James Zhu", email = "zhuyangjunfeng@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
agentabstain = "agentabstain.main:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentabstain"
