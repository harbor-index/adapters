[project]
name = "harbor-tabarena-adapter"
version = "0.1.0"
description = "TabArena adapter for the official Lite split with protected Python prediction and native error"
readme = "README.md"
authors = [{name = "Joachim Baumann", email = "joachimbaumann1@gmail.com"}]
requires-python = ">=3.11"
dependencies = ["liac-arff==2.5.0", "numpy==2.2.6"]
[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4", "pandas==2.2.3", "scikit-learn==1.7.2", "autogluon.core==1.6.4b20261109"]
[project.scripts]
tabarena = "tabarena.main:main"
[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-name = "tabarena"

